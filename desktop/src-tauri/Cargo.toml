[package]
name = "stream-control-center"
version = "3.0.0"
description = "Universal RTMP source, SRS and OBS control center"
authors = ["Ilya"]
edition = "2021"

[lib]
name = "gopro_control_center_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["time"] }
